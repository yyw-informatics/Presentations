<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Write Less, Think More: An Introduction to Agentic Coding with R</title>
  <style>
:root {
  --bg: #05070c;
  --bg2: #0b1220;
  --panel: #0d1422;
  --panel2: #090f1a;
  --line: #243149;
  --ink: #f4f7fb;
  --muted: #aeb9cc;
  --muted2: #71809a;
  --blue: #5bb4ff;
  --cyan: #35d6e8;
  --purple: #a795ff;
  --pink: #f281ba;
  --green: #54d9a0;
  --amber: #ffc65b;
  --red: #ff7d7d;
  --font: "Aptos", "Inter", "Segoe UI", Arial, sans-serif;
  --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
  --slide-width: 1280px;
  --slide-height: 720px;
  --slide-pad-x: 56px;
  --slide-pad-y: 30px;
  --section-accent: var(--cyan);
  --section-rgb: 53, 214, 232;
}

* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #05070f;
  color: var(--ink);
  font-family: var(--font);
}
body { -webkit-font-smoothing: antialiased; }
button, a { font: inherit; }

#app {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
}

body.presenter #app { right: 380px; }
body.presenter.notes-hidden #app { right: 0; }
body.presenter:not(.notes-hidden) #deck { transform-origin: left center; }

#deck {
  position: relative;
  width: var(--slide-width);
  height: var(--slide-height);
  transform-origin: center center;
}

.slide {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  width: var(--slide-width);
  height: var(--slide-height);
  padding: var(--slide-pad-y) var(--slide-pad-x);
  overflow: hidden;
  background:
    radial-gradient(1100px 620px at 74% -8%, #13213a 0%, #0a0e18 54%, #070a12 100%);
}
.slide.active { display: flex; }

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 18px;
}
.deck-id {
  color: #e4f0ff;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.progress {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 7px;
}
.progress-label {
  color: var(--blue);
  font-size: 17px;
  font-weight: 900;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.progress-bars { display: flex; gap: 5px; }
.progress-bars i {
  display: block;
  width: 20px;
  height: 5px;
  border-radius: 999px;
  background: #22304d;
}
.progress-bars i.done { background: #33507d; }
.progress-bars i.on { background: var(--blue); }

h1 {
  max-width: 1120px;
  margin: 12px 0 0;
  color: var(--ink);
  font-size: 45px;
  font-weight: 900;
  letter-spacing: -.025em;
  line-height: 1.05;
}
h1 span { color: var(--blue); }
h2, h3, h4 { color: var(--ink); }
p { margin: 0; }
.subtitle {
  max-width: 1030px;
  margin-top: 10px;
  color: var(--muted);
  font-size: 20px;
  line-height: 1.35;
}
.kicker {
  color: var(--cyan);
  font-size: 16px;
  font-weight: 900;
  letter-spacing: .22em;
  text-transform: uppercase;
}
.lead {
  max-width: 850px;
  margin: 16px 0 20px;
  color: var(--muted);
  font-size: 22px;
  line-height: 1.35;
}
.eyebrow {
  margin-bottom: 8px;
  color: var(--muted2);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.panel, .card, .step, .timeline-node {
  border: 1px solid var(--line);
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(16, 26, 48, .98), rgba(13, 21, 38, .98));
  box-shadow: 0 16px 30px rgba(0, 0, 0, .18);
}
.panel, .card { padding: 22px 24px; }
.panel h2, .panel h3, .card h2, .card h3 {
  margin: 0 0 12px;
  font-size: 23px;
  line-height: 1.15;
}
.panel p, .card p, .body-copy, li {
  color: var(--muted);
  font-size: 17px;
  line-height: 1.42;
}
.panel .big-number, .card .big-number {
  margin: 8px 0 6px;
  color: var(--ink);
  font-size: 38px;
  font-weight: 900;
}
.panel .label, .card .label {
  color: var(--muted);
  font-size: 14px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.accent-cyan { border-color: #1e6a7a; }
.accent-cyan h2, .accent-cyan h3, .accent-cyan .big-number { color: var(--cyan); }
.accent-purple { border-color: #4a3c7d; }
.accent-purple h2, .accent-purple h3, .accent-purple .big-number { color: var(--purple); }
.accent-pink { border-color: #72405e; }
.accent-pink h2, .accent-pink h3, .accent-pink .big-number { color: var(--pink); }
.accent-green { border-color: #245b42; }
.accent-green h2, .accent-green h3, .accent-green .big-number { color: var(--green); }
.accent-amber { border-color: #6d551d; }
.accent-amber h2, .accent-amber h3, .accent-amber .big-number { color: var(--amber); }
.accent-red { border-color: #704040; }
.accent-red h2, .accent-red h3, .accent-red .big-number { color: var(--red); }

ul.clean, ol.clean {
  margin: 0;
  padding: 0;
  list-style: none;
}
ul.clean li {
  position: relative;
  margin: 8px 0;
  padding-left: 18px;
}
ul.clean li::before {
  position: absolute;
  top: .68em;
  left: 0;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--blue);
  content: "";
}
ol.numbered { counter-reset: item; }
ol.numbered li {
  position: relative;
  min-height: 32px;
  margin: 13px 0;
  padding-left: 44px;
  counter-increment: item;
}
ol.numbered li::before {
  position: absolute;
  top: .02em;
  left: 0;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--purple);
  color: #06101f;
  font-size: 17px;
  font-weight: 900;
  content: counter(item);
}

.grid {
  display: grid;
  gap: 22px;
}
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
.grid.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
.slide-body { flex: 1; min-height: 0; }

.image-frame {
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 18px;

}
.image-frame.light { background: #f6f9fb; }
.image-frame img {
  display: block;

  border-radius: 12px;
  object-fit: contain;
}
.image-frame.cover img { width: 100%; height: 100%; object-fit: cover; }
.image-caption {
  margin-top: 8px;
  color: var(--muted2);
  font-size: 13px;
  text-align: center;
}

.layout-title .cover-grid {
  display: grid;
  flex: 1;
  grid-template-columns: .95fr 1.05fr;
  gap: 30px;
  align-items: center;
  min-height: 0;
}
.layout-title.no-image .cover-grid {
  grid-template-columns: 1fr;
  max-width: 980px;
}
.layout-title .cover-copy h1 { margin-top: 12px; font-size: 62px; line-height: 1; }
.layout-title.no-image .cover-copy h1 { font-size: 68px; }
.layout-title .cover-copy h1 .title-secondary {
  display: block;
  margin-top: 10px;
  font-size: .48em;
  line-height: 1.12;
  font-weight: 650;
  letter-spacing: -.012em;
}
.layout-title .hero { height: 475px; }
.cover-credits {
  position: absolute;
  bottom: 30px;
  left: var(--slide-pad-x);
  display: grid;
  gap: 4px;
  max-width: 900px;
  padding-left: 14px;
  border-left: 2px solid rgba(53, 214, 232, .56);
  color: var(--muted);
  font-size: 17px;
  font-weight: 500;
}
.cover-credits strong {
  color: #e8f1fb;
  font-size: 18px;
  font-weight: 760;
  line-height: 1.15;
}
.cover-credits span {
  color: #95a3b6;
  font-size: 14px;
  line-height: 1.22;
}
.dotlist {
  display: grid;
  gap: 14px;
  margin-top: 24px;
}
.dotitem { display: flex; gap: 14px; align-items: flex-start; }
.dotitem .dot {
  flex: 0 0 auto;
  width: 10px;
  height: 10px;
  margin-top: 9px;
  border-radius: 50%;
  background: var(--blue);
}
.dotitem p { color: #b9c7e4; font-size: 20px; line-height: 1.35; }
.dotitem b { color: #f4f8ff; font-weight: 900; }

.layout-image .single-image-wrap {
  display: flex;
  flex: 1;
  align-items: center;
  justify-content: center;
  min-height: 0;
  margin-top: 24px;
}
.layout-image .single-image-wrap .image-frame {
  width: 1120px;
  height: 455px;
}

.layout-cards .grid { margin-top: 36px; }
.layout-cards .card { min-height: 240px; }
.card-number {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  margin-bottom: 18px;
  border-radius: 999px;
  background: var(--cyan);
  color: #06101f;
  font-size: 21px;
  font-weight: 900;
}
.accent-purple .card-number { background: var(--purple); }
.accent-pink .card-number { background: var(--pink); }
.accent-green .card-number { background: var(--green); }
.accent-amber .card-number { background: var(--amber); }

.layout-split .split-grid {
  display: grid;
  flex: 1;
  gap: 24px;
  align-items: stretch;
  min-height: 0;
  margin-top: 24px;
}
.layout-split .split-grid > * { min-width: 0; }
.block-stack { display: grid; gap: 14px; height: 100%; }
.block-list { height: 100%; }
.block-list .panel { height: 100%; }
.quote {
  display: grid;
  place-items: center;
  height: 100%;
  padding: 30px;
  border: 1px solid #2f4269;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(74, 168, 255, .12), rgba(155, 125, 255, .1));
  color: #dfe7ff;
  font-size: 27px;
  font-weight: 800;
  line-height: 1.35;
  text-align: center;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}
.chip {
  padding: 7px 11px;
  border: 1px solid #2d7e8e;
  border-radius: 999px;
  background: rgba(34, 211, 238, .08);
  color: var(--cyan);
  font-size: 13px;
  font-style: normal;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
}

.layout-metrics .metrics-grid {
  display: grid;
  flex: 1;
  grid-template-columns: .65fr 1.35fr;
  gap: 20px;
  min-height: 0;
  margin-top: 28px;
}
.stat-stack { display: grid; gap: 14px; }
.stat-card { padding: 20px; text-align: center; }
.stat-card .big-number { font-size: 42px; }
.bar-panel { padding: 22px 24px; }
.bar-panel h3 { margin: 0 0 18px; font-size: 25px; }
.bar-row {
  display: grid;
  grid-template-columns: 180px 70px 1fr;
  gap: 10px;
  align-items: center;
  margin: 9px 0;
}
.bar-row .bar-label { color: var(--muted); font-size: 15px; text-align: right; }
.bar-row .bar-value { color: var(--ink); font-size: 14px; font-weight: 900; white-space: nowrap; }
.bar-track { height: 13px; overflow: hidden; border-radius: 7px; background: #0b1428; }
.bar-fill { height: 100%; border-radius: 7px; background: var(--blue); }

.layout-process .process-flow {
  display: grid;
  flex: 1;
  align-items: stretch;
  gap: 10px;
  min-height: 0;
  margin-top: 52px;
}
.step {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 300px;
  padding: 20px;
}
.step h3 { margin: 0; color: var(--blue); font-size: 18px; }
.step .step-text { margin: auto 0; color: var(--ink); font-size: 20px; line-height: 1.35; text-align: center; }
.step pre {
  margin: auto 0;
  padding: 16px;
  border: 1px solid #1b2946;
  border-radius: 10px;
  background: #050913;
  color: #cfe0ff;
  font-family: var(--mono);
  font-size: 14px;
  line-height: 1.55;
  white-space: pre-wrap;
}
.step small { color: var(--muted2); font-size: 13px; text-align: center; }
.flow-arrow { display: grid; place-items: center; color: var(--blue); font-size: 30px; }

.layout-loop .loop-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
  flex: 1;
  min-height: 0;
  margin-top: 34px;
}
.loop-card { min-height: 420px; overflow: visible; }
.cycle {
  position: relative;
  width: 300px;
  height: 190px;
  margin: 18px auto 10px;
  border: 2px dashed #2a3c5e;
  border-radius: 50%;
}
.cycle-node {
  position: absolute;
  padding: 9px 18px;
  border: 1px solid #2a3c5e;
  border-radius: 999px;
  background: #16223b;
  color: var(--cyan);
  font-weight: 900;
}
.cycle-node:nth-child(1) { top: -18px; left: 100px; }
.cycle-node:nth-child(2) { right: -10px; bottom: 42px; color: var(--amber); }
.cycle-node:nth-child(3) { bottom: 42px; left: -24px; color: var(--green); }
.cycle-center { position: absolute; inset: 0; display: grid; place-items: center; color: var(--cyan); font-size: 62px; }
.stack-list { display: grid; gap: 12px; margin-top: 20px; }
.stack-item {
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #0b1428;
  color: #d7e1f8;
  font-size: 18px;
}
.stack-item.emphasis { border-color: #256e94; background: #10243a; color: #fff; font-weight: 900; }

.layout-timeline .timeline {
  display: grid;
  flex: 1;
  gap: 12px;
  min-height: 0;
  margin-top: 40px;
}
.timeline-node { min-height: 270px; padding: 16px 13px; text-align: center; }
.timeline-number {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  margin: 0 auto 12px;
  border-radius: 999px;
  background: var(--blue);
  color: #06101f;
  font-size: 21px;
  font-weight: 900;
}
.timeline-node h3 { margin: 0; font-size: 18px; }
.timeline-node h4 {
  min-height: 28px;
  margin: 4px 0 12px;
  color: var(--cyan);
  font-size: 12px;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.timeline-node li { font-size: 13.5px; text-align: left; }
.deliverables {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-top: 14px;
  margin-bottom: 30px;
  padding: 14px 18px;
  border: 1px solid #3e3b74;
  border-radius: 14px;
  background: rgba(155, 125, 255, .12);
  color: #dfe7ff;
  font-size: 16px;
  text-align: center;
}
.deliverables b { color: #fff; font-size: 18px; }

.layout-closing .closing-grid {
  display: grid;
  flex: 1;
  grid-template-columns: .85fr 1fr 1.05fr;
  gap: 30px;
  align-items: start;
  min-height: 0;
  margin-top: 32px;
}
.layout-closing h2 { margin: 0 0 18px; font-size: 28px; }
.layout-closing li { color: #d7e1f8; font-size: 21px; line-height: 1.3; }
.closing-link {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  color: inherit;
  text-decoration: none;
}
.closing-link .link-label {
  padding: 9px 16px;
  border-radius: 999px;
  background: var(--cyan);
  box-shadow: 0 12px 22px rgba(34, 211, 238, .2);
  color: #06101f;
  font-size: 16px;
  font-weight: 900;
}
.closing-link img { width: 390px; max-height: 330px; object-fit: contain; filter: drop-shadow(0 16px 22px rgba(0, 0, 0, .42)); }

.layout-custom .custom-wrap { flex: 1; min-height: 0; margin-top: 24px; }
.trace-diagram {
  display: grid;
  grid-template-columns: 1fr 60px 1fr 60px 1fr;
  align-items: center;
  height: 390px;
}
.trace-node {
  padding: 28px 20px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: linear-gradient(180deg, #111b31, #0d1526);
  text-align: center;
}
.trace-node b { display: block; margin-bottom: 10px; color: var(--cyan); font-size: 23px; }
.trace-node span { color: var(--muted); font-size: 17px; line-height: 1.4; }
.trace-arrow { color: var(--blue); font-size: 34px; font-weight: 900; text-align: center; }

.nav {
  position: fixed;
  z-index: 20;
  bottom: 16px;
  left: 50%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 13px;
  border: 1px solid #22304d;
  border-radius: 999px;
  background: rgba(8, 12, 22, .86);
  opacity: .78;
  transform: translateX(-50%);
  backdrop-filter: blur(8px);
  transition: opacity .18s ease;
}
.nav:hover, .nav:focus-within { opacity: 1; }
.nav button { padding: 4px 10px; border: 0; border-radius: 9px; background: transparent; color: #dbeafe; font-size: 20px; cursor: pointer; }
.nav button:hover { background: #1a2743; }
.nav span { min-width: 58px; color: var(--muted); font-size: 13px; text-align: center; }
.hint { position: fixed; z-index: 20; top: 12px; right: 18px; color: #62718d; font-size: 12px; opacity: .18; }
.kbd { padding: 1px 6px; border: 1px solid #2a3c5e; border-radius: 5px; background: #101a30; color: #a8b6d4; font-family: var(--mono); }

.speaker-notes {
  position: fixed;
  z-index: 30;
  top: 0;
  right: 0;
  bottom: 0;
  width: 380px;
  overflow-y: auto;

  background: #070b14;
  color: var(--muted);
}
.notes-hidden .speaker-notes { display: none; }
.notes-heading {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);

  font-weight: 900;
  letter-spacing: .06em;
  text-transform: uppercase;
}
#notes-slide-id { color: var(--blue); font-size: 12px; }
.note-duration {

  padding: 5px 9px;

  font-size: 12px;
  font-weight: 800;

.note-section { margin-top: 18px; }
.note-section h3 { margin: 0 0 7px; color: var(--ink); font-size: 15px; }
.note-section .clean { gap: 6px; font-size: 14px; line-height: 1.45; }
.notes-empty { margin-top: 18px; color: var(--muted2); font-size: 14px; }
.presenter .nav { left: calc((100% - 380px) / 2); }
.presenter.notes-hidden .nav { left: 50%; }
.presenter .hint { right: 398px; }
.presenter.notes-hidden .hint { right: 18px; }

.debug .slide { outline: 2px dashed rgba(242, 109, 109, .8); outline-offset: -4px; }
.debug .overflowing { box-shadow: inset 0 0 0 6px rgba(242, 109, 109, .9); }

  z-index: 99;
  right: 12px;
  bottom: 12px;

/* --------------------------------------------------------------------------
   Cinematic scientific system
   -------------------------------------------------------------------------- */

.slide[data-section="why-agentic-coding-now"] {
  --section-accent: var(--cyan);
  --section-rgb: 53, 214, 232;
}
.slide[data-section="how-coding-agents-work"] {
  --section-accent: var(--blue);
  --section-rgb: 91, 180, 255;
}
.slide[data-section="scientific-judgment-in-the-loop"] {
  --section-accent: var(--green);
  --section-rgb: 84, 217, 160;
}
.slide[data-section="reserved-use-cases"] {
  --section-accent: var(--amber);
  --section-rgb: 255, 198, 91;
}
.slide[data-section="r-learning-path"] {
  --section-accent: var(--amber);
  --section-rgb: 255, 198, 91;
}
.slide[data-section="closing"] {
  --section-accent: var(--cyan);
  --section-rgb: 53, 214, 232;
}

.slide {
  isolation: isolate;

  <script>
(() => {
  "use strict";

  const deckData = window.DECK;
  const speakerNotes = window.SPEAKER_NOTES || {};
  if (!deckData || !Array.isArray(deckData.slides)) {
    throw new Error("deck-content.js must define window.DECK with a slides array.");
  }

  const deckEl = document.getElementById("deck");
  const countEl = document.getElementById("count");
  const colorMap = {
    blue: "var(--blue)",
    cyan: "var(--cyan)",
    purple: "var(--purple)",
    pink: "var(--pink)",
    green: "var(--green)",
    amber: "var(--amber)",
    red: "var(--red)"
  };

  const esc = (value = "") => String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

  const accentClass = (name) => name ? `accent-${esc(name)}` : "";
  const accentStyle = (name) => colorMap[name] || colorMap.blue;

  function renderTitle(title, highlight, titleSegments) {
    const safeTitle = esc(title || "Untitled slide");
    if (Array.isArray(titleSegments) && titleSegments.length) {
      const plainTitle = titleSegments
        .map((segment) => typeof segment === "string" ? segment : String(segment?.text || ""))
        .join("");
      if (plainTitle === String(title || "")) {
        return titleSegments.map((segment) => {
          if (typeof segment === "string") return esc(segment);
          const text = esc(segment?.text || "");
          const tone = colorMap[segment?.color] ? ` tone-${segment.color}` : "";
          const size = segment?.size === "secondary" ? " title-secondary" : "";
          if (segment?.highlight === false) {
            return size ? `<span class="${size.trim()}">${text}</span>` : text;
          }
          return `<span class="title-accent${tone}${size}">${text}</span>`;
        }).join("");
      }
    }
    if (!highlight) return safeTitle;
    const safeHighlight = esc(highlight);
    const index = safeTitle.indexOf(safeHighlight);
    if (index < 0) return safeTitle;
    return `${safeTitle.slice(0, index)}<span class="title-accent">${safeHighlight}</span>${safeTitle.slice(index + safeHighlight.length)}`;
  }

  function renderBullets(items = [], ordered = false) {
    if (!items.length) return "";
    const tag = ordered ? "ol" : "ul";
    const cls = ordered ? "clean numbered" : "clean";
    const rows = items.map((item) => {
      const text = typeof item === "string" ? esc(item) : (item.html || esc(item.text || ""));
      return `<li>${text}</li>`;
    }).join("");
    return `<${tag} class="${cls}">${rows}</${tag}>`;
  }

  function renderChips(chips = []) {
    if (!chips.length) return "";
    return `<div class="chips">${chips.map((chip) => `<i class="chip">${esc(chip)}</i>`).join("")}</div>`;
  }

  function renderTopbar(slide, index, total) {
    const bars = Array.from({ length: total }, (_, i) => {
      const cls = i < index ? "done" : (i === index ? "on" : "");
      return `<i class="${cls}"></i>`;
    }).join("");
    return `
      <div class="topbar">
        <div class="deck-id">${esc(deckData.meta?.shortTitle || deckData.meta?.title || "Presentation")}</div>
        <div class="progress">
          <div class="progress-label">${esc(slide.section || "Slide")} &middot; ${index + 1}/${total}</div>
          <div class="progress-bars">${bars}</div>
        </div>
      </div>`;
  }

  function renderHeading(slide) {
    return `
      <h1>${renderTitle(slide.title, slide.highlight, slide.titleSegments)}</h1>
      ${slide.subtitle ? `<div class="subtitle">${esc(slide.subtitle)}</div>` : ""}`;
  }

  function renderCardIcon(kind) {
    if (kind === "model-response") {
      return `<div class="card-concept-visual model-response-visual" aria-hidden="true">
        <div class="concept-flow-node"><small>input</small><b>prompt</b></div>
        <span class="concept-flow-arrow">→</span>
        <div class="concept-model-node">LLM</div>
        <span class="concept-flow-arrow">→</span>
        <div class="concept-flow-node"><small>output</small><b>response</b></div>
        <div class="concept-visual-caption">one pass</div>
      </div>`;
    }
    if (kind === "agent-loop") {
      return `<div class="card-concept-visual agent-loop-visual" aria-hidden="true">
        <div class="agent-straight-loop">
          <span class="agent-loop-label agent-loop-goal">goal</span>
          <span class="agent-loop-arrow agent-loop-arrow-in">→</span>
          <div class="agent-core-node">LLM</div>
          <span class="agent-loop-arrow agent-loop-arrow-out">→</span>
          <span class="agent-loop-label agent-loop-act">act</span>
          <span class="agent-loop-arrow agent-loop-arrow-down">↓</span>
          <span class="agent-loop-label agent-loop-next">next</span>
          <span class="agent-loop-arrow agent-loop-arrow-return">←</span>
          <span class="agent-loop-label agent-loop-observe">observe</span>
          <span class="agent-loop-arrow agent-loop-arrow-up">↑</span>
        </div>
        <div class="concept-visual-caption">continue with feedback</div>
      </div>`;
    }
    return "";
  }

  function renderPanelVisual(visual) {
    if (!visual) return "";
    if (visual.kind === "model-guess") {
      return `<div class="panel-visual model-guess-visual" aria-label="The model predicts an answer without obtaining an observation">
        <div class="panel-visual-question"><span>question</span>${esc(visual.question || "")}</div>
        <div class="panel-visual-flow">
          <div class="mini-model-node">LLM<small>predict</small></div>
          <span class="panel-flow-arrow" aria-hidden="true">→</span>
          <div class="guess-output"><small>generated answer</small><b>${esc(visual.answer || "")}</b><i aria-hidden="true">?</i></div>
        </div>
        <div class="panel-visual-caption">${esc(visual.caption || "No result was observed")}</div>
      </div>`;
    }
    if (visual.kind === "tool-observe") {
      return `<div class="panel-visual tool-observe-visual" aria-label="The model requests an R computation and receives the observed result">
        <div class="panel-visual-question"><span>question</span>${esc(visual.question || "")}</div>
        <div class="panel-visual-flow tool-flow">
          <div class="mini-model-node">LLM<small>request</small></div>
          <span class="panel-flow-arrow" aria-hidden="true">→</span>
          <div class="mini-r-console"><small>R executes</small><code>${esc(visual.code || "")}</code><b>${esc(visual.result || "")}</b></div>
          <span class="observation-return" aria-hidden="true">↩ observation</span>
        </div>
        <div class="panel-visual-caption">${esc(visual.caption || "Run, observe, then decide the next move")}</div>
      </div>`;
    }
    return "";
  }

  function renderCard(card, index, numbered) {
    return `
      <article class="card ${accentClass(card.accent)}">
        ${numbered ? `<div class="card-number">${index + 1}</div>` : ""}
        ${card.label ? `<div class="eyebrow">${esc(card.label)}</div>` : ""}
        ${renderCardIcon(card.icon)}
        ${card.value ? `<div class="big-number">${esc(card.value)}</div>` : ""}
        ${card.title ? `<h3>${esc(card.title)}</h3>` : ""}
        ${card.body ? `<p>${esc(card.body)}</p>` : ""}
        ${renderBullets(card.bullets)}
        ${card.href ? `<a class="card-source-link" href="${esc(card.href)}" target="_blank" rel="noreferrer noopener">${esc(card.linkLabel || "Open source")} <span aria-hidden="true">↗</span></a>` : ""}
      </article>`;
  }

  function renderPaperSource(source) {
    const body = `
      <span class="paper-source-shot">
        <img src="${esc(source.image)}" alt="${esc(source.alt || source.name || "Article record")}">
      </span>`;
    if (!source.href) return `<div class="paper-source">${body}</div>`;
    return `<a class="paper-source" href="${esc(source.href)}" target="_blank" rel="noreferrer noopener" aria-label="${esc(source.linkLabel || `Open ${source.name || "article record"}`)}">${body}</a>`;
  }

  function renderBlock(block) {
    if (!block) return `<div></div>`;
    if (block.kind === "image") {
      return `
        <div>
          <div class="image-frame ${block.cover ? "cover" : ""}">
            <img src="${esc(block.src)}" alt="${esc(block.alt || "Presentation visual")}">
          </div>
          ${block.caption ? `<div class="image-caption">${esc(block.caption)}</div>` : ""}
        </div>`;
    }
    if (block.kind === "quote") {
      return `<div class="quote">${block.html || esc(block.text || "")}</div>`;
    }
    if (block.kind === "html") {
      return `<div class="block-html">${block.html || ""}</div>`;
    }
    if (block.kind === "stack") {
      return `<div class="block-stack">${(block.blocks || []).map(renderBlock).join("")}</div>`;
    }
    const title = block.title ? `<h3>${esc(block.title)}</h3>` : "";
    const body = block.body ? `<p>${esc(block.body)}</p>` : "";
    return `
      <div class="block-list">
        <div class="panel ${accentClass(block.accent)}">
          ${title}${body}${renderPanelVisual(block.visual)}${renderBullets(block.bullets)}${renderChips(block.chips)}
        </div>
      </div>`;
  }

  function renderCoverCredits(credits) {
    if (!credits) return "";
    if (typeof credits === "string") return `<div class="cover-credits"><strong>${esc(credits)}</strong></div>`;
    const name = String(credits.name || "").trim();
    const details = Array.isArray(credits.details)
      ? credits.details.filter((item) => String(item || "").trim())
      : [];
    if (!name && !details.length) return "";
    return `<div class="cover-credits">
      ${name ? `<strong>${esc(name)}</strong>` : ""}
      ${details.map((detail) => `<span>${esc(detail)}</span>`).join("")}
    </div>`;
  }

  function layoutTitle(slide) {
    return `
      <div class="cover-grid">
        <div class="cover-copy">
          ${slide.kicker ? `<div class="kicker">${esc(slide.kicker)}</div>` : ""}
          <h1>${renderTitle(slide.title, slide.highlight, slide.titleSegments)}</h1>
          ${slide.subtitle ? `<div class="lead">${esc(slide.subtitle)}</div>` : ""}
          <div class="dotlist">
            ${(slide.bullets || []).map((item) => `
              <div class="dotitem">
                <span class="dot" style="background:${accentStyle(item.color)}"></span>
                <p>${item.html || esc(item.text || "")}</p>
              </div>`).join("")}
          </div>
        </div>
        ${slide.image ? `<div class="image-frame hero"><img src="${esc(slide.image)}" alt="${esc(slide.imageAlt || "Title slide visual")}"></div>` : ""}
      </div>
      ${renderCoverCredits(slide.credits)}`;
  }

  function layoutImage(slide) {
    return `${renderHeading(slide)}
      <div class="single-image-wrap">
        <div class="image-frame ${slide.imageBackground === "light" ? "light" : ""}">
          <img src="${esc(slide.image)}" alt="${esc(slide.imageAlt || "Presentation visual")}">
        </div>
      </div>`;
  }

  function renderPracticeStrip(practice) {
    const rawLabel = String(practice.label || "Good practice").trim();
    const labelMatch = rawLabel.match(/^(.*?)(\d+)$/);
    const kicker = labelMatch ? labelMatch[1].trim() : rawLabel;
    const number = labelMatch ? labelMatch[2].padStart(2, "0") : "";
    const promptBullets = Array.isArray(practice.promptBullets)
      ? practice.promptBullets.filter((item) => String(item || "").trim())
      : [];
    const promptContent = promptBullets.length
      ? `<ul>${promptBullets.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>`
      : `<p>${esc(practice.prompt || "")}</p>`;

    return `<div class="practice-strip" aria-label="${esc(rawLabel)}">
      <div class="practice-rule">
        <div class="practice-marker">
          <span class="practice-kicker">${esc(kicker)}</span>
          ${number ? `<span class="practice-number">${esc(number)}</span>` : ""}
        </div>
        <strong>${esc(practice.title || "Inspect before you model")}</strong>
      </div>
      <div class="practice-prompt">
        <div class="practice-terminal-bar">
          <span class="practice-terminal-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>${esc(practice.promptLabel || "Example prompt")}</span>
        </div>
        <div class="practice-command">
          <span class="practice-chevron" aria-hidden="true">&gt;</span>
          ${promptContent}
        </div>
      </div>
    </div>`;
  }

  function layoutCards(slide) {
    const cols = Math.min(5, Math.max(2, Number(slide.columns || slide.cards?.length || 3)));
    return `${renderHeading(slide)}
      <div class="grid cols-${cols}">
        ${(slide.cards || []).map((card, i) => renderCard(card, i, slide.numbered)).join("")}
      </div>
      ${slide.practiceStrip ? renderPracticeStrip(slide.practiceStrip) : ""}
      ${(slide.paperSources || []).length ? `
        <div class="evidence-strip">
          ${slide.paperSourcesLabel ? `<div class="evidence-strip-label">${esc(slide.paperSourcesLabel)}</div>` : ""}
          <div class="paper-source-grid">
            ${slide.paperSources.map(renderPaperSource).join("")}
          </div>
        </div>` : ""}`;
  }

  function layoutMetrics(slide) {
    const max = Math.max(1, ...(slide.bars || []).map((bar) => Number(bar.value || 0)));
    return `${renderHeading(slide)}
      <div class="metrics-grid">
        <div class="stat-stack">
          ${(slide.stats || []).map((stat) => `
            <div class="card stat-card ${accentClass(stat.accent)}">
              <div class="big-number">${esc(stat.value)}</div>
              <div class="label">${esc(stat.label)}</div>
            </div>`).join("")}
        </div>
        <div class="panel bar-panel">
          <h3>${esc(slide.barTitle || "Distribution")}</h3>
          ${(slide.bars || []).map((bar) => `
            <div class="bar-row">
              <span class="bar-label">${esc(bar.label)}</span>
              <b class="bar-value">${esc(bar.display ?? bar.value)}</b>
              <span class="bar-track"><i class="bar-fill" style="width:${Math.max(2, Number(bar.value || 0) / max * 100)}%;background:${accentStyle(bar.color)}"></i></span>
            </div>`).join("")}
        </div>
      </div>`;
  }

  function layoutSplit(slide) {
    const columns = esc(slide.columns || "1fr 1fr");
    return `${renderHeading(slide)}
      <div class="split-grid" style="grid-template-columns:${columns}">
        ${renderBlock(slide.left)}
        ${renderBlock(slide.right)}
      </div>`;
  }

  function layoutProcess(slide) {
    const steps = slide.steps || [];
    const columns = [];
    steps.forEach((_, i) => {
      columns.push("1fr");
      if (i < steps.length - 1) columns.push("32px");
    });
    const parts = [];
    steps.forEach((step, i) => {
      parts.push(`
        <div class="step">
          <h3>${esc(step.label || `Step ${i + 1}`)}</h3>
          ${step.code ? `<pre>${esc(step.code)}</pre>` : `<div class="step-text">${esc(step.text || "")}</div>`}
          ${step.note ? `<small>${esc(step.note)}</small>` : ""}
        </div>`);
      if (i < steps.length - 1) parts.push(`<b class="flow-arrow">&rarr;</b>`);
    });
    const example = slide.exampleStrip;
    const exampleStrip = example ? `
      <div class="process-example-strip">
        <span class="process-example-label">${esc(example.label || "Another tool call")}</span>
        <span class="process-example-question">${esc(example.question || "")}</span>
        <code>${esc(example.code || "")}</code>
        <span class="process-example-arrow" aria-hidden="true">→</span>
        <b>${esc(example.result || "")}</b>
      </div>` : "";
    return `${renderHeading(slide)}
      <div class="process-flow" style="grid-template-columns:${columns.join(" ")}">${parts.join("")}</div>
      ${exampleStrip}`;
  }

  function layoutLoop(slide) {
    const cycle = slide.cycle || ["Reason", "Act", "Observe"];
    return `${renderHeading(slide)}
      <div class="loop-grid">
        <div class="panel loop-card accent-cyan">
          <h2>${esc(slide.leftTitle || "Loop")}</h2>
          <div class="cycle">
            ${cycle.slice(0, 3).map((item) => `<div class="cycle-node">${esc(item)}</div>`).join("")}
            <span class="cycle-center">&#8635;</span>
          </div>
          ${slide.cycleNote ? `<p>${esc(slide.cycleNote)}</p>` : ""}
        </div>
        <div class="panel loop-card accent-purple">
          <h2>${esc(slide.rightTitle || "Decision stack")}</h2>
          <div class="stack-list">
            ${(slide.stack || []).map((item) => {
              const obj = typeof item === "string" ? { text: item } : item;
              return `<div class="stack-item ${obj.emphasis ? "emphasis" : ""}">${esc(obj.text)}</div>`;
            }).join("")}
          </div>
        </div>
      </div>`;
  }

  function layoutTimeline(slide) {
    const stages = slide.stages || [];
    return `${renderHeading(slide)}
      <div class="timeline" style="grid-template-columns:repeat(${Math.max(1, stages.length)}, minmax(0, 1fr))">
        ${stages.map((stage, i) => `
          <div class="timeline-node">
            <b class="timeline-number">${i + 1}</b>
            <h3>${esc(stage.title)}</h3>
            <h4>${esc(stage.subtitle || "")}</h4>
            ${renderBullets(stage.bullets)}
          </div>`).join("")}
      </div>
      ${(slide.deliverables || []).length ? `<div class="deliverables"><b>Deliverables</b>${slide.deliverables.map((d) => `<span>${esc(d)}</span>`).join("")}</div>` : ""}`;
  }

  function layoutClosing(slide) {
    return `${renderHeading(slide)}
      <div class="closing-grid">
        <div>
          <h2>${esc(slide.actionsTitle || "Immediate actions")}</h2>
          ${renderBullets(slide.actions)}
        </div>
        <div>
          <h2>${esc(slide.intakeTitle || "Brief intake")}</h2>
          ${renderBullets(slide.intake, true)}
        </div>
        <a class="closing-link" href="${esc(slide.link || "#")}" target="_blank" rel="noopener">
          <span class="link-label">${esc(slide.linkLabel || "Open link")}</span>
          <img src="${esc(slide.image)}" alt="${esc(slide.imageAlt || "Closing visual")}">
        </a>
      </div>`;
  }

  function renderLlmConceptMap(slide) {
    const mechanism = slide.mechanism || {};
    const tokens = mechanism.tokens || [];
    const contexts = mechanism.contextExamples || [];
    const predictions = mechanism.predictions || [];
    return `${renderHeading(slide)}
      <div class="llm-concept-layout">
        <div class="llm-mechanism">
          <div class="llm-mechanism-label">Inside the LLM</div>
          <section class="mechanism-stage stage-tokenize">
            <div class="mechanism-index">01</div>
            <div class="mechanism-copy">
              <div class="mechanism-kicker">Tokenize</div>
              <code class="r-code-line">${esc(mechanism.input || "")}</code>
              <div class="token-row">
                ${tokens.map((token, index) => `<span class="r-token token-tone-${index % 5}">${esc(token)}</span>`).join("")}
              </div>
            </div>
          </section>
          <section class="mechanism-stage stage-embed">
            <div class="mechanism-index">02</div>
            <div class="mechanism-copy">
              <div class="mechanism-kicker">Embed in context</div>
              <div class="context-contrast">
                ${contexts.map((item) => `
                  <div class="context-example">
                    <code>${esc(item.code || "")}</code>
                    <span class="vector-glyph">[ · · · ]</span>
                    <b>${esc(item.meaning || "")}</b>
                  </div>`).join("")}
              </div>
              <div class="mechanism-note">The same token can occupy a different position when its surrounding code changes.</div>
            </div>
          </section>
          <section class="mechanism-stage stage-predict">
            <div class="mechanism-index">03</div>
            <div class="mechanism-copy prediction-copy">
              <div>
                <div class="mechanism-kicker">Predict and repeat</div>
                <code class="r-code-line">${esc(mechanism.prompt || "")}</code>
                <div class="prediction-loop">append <span aria-hidden="true">→</span> predict again <span class="loop-arrow" aria-hidden="true">↻</span></div>
              </div>
              <div class="prediction-list" aria-label="Illustrative next-token probabilities">
                ${predictions.map((item) => {
                  const strength = Math.max(20, Math.min(100, Number(item.strength || 60)));
                  return `<div class="prediction-choice"><span>${esc(item.token || "")}</span><i style="--prediction-strength:${strength}%"></i></div>`;
                }).join("")}
              </div>
            </div>
          </section>
        </div>
      </div>`;
  }

  function renderAgentSystemMap(slide) {
    const llm = slide.llm || {};
    const agent = slide.agent || {};
    const harness = slide.harness || {};
    const coding = slide.coding || {};
    const pills = (items, className = "") => (items || [])
      .map((item) => `<span class="system-pill ${className}">${esc(item)}</span>`)
      .join("");

    return `${renderHeading(slide)}
      <div class="agent-system-map" role="img" aria-label="A nested systems map. Tokens and embeddings support an LLM. An agent adds tools and a reason-act-observe loop. An agent harness adds context, permissions, state, and tool execution. A coding agent specializes the complete system for software work.">
        <section class="map-llm-core concept-layer">
          <span class="system-layer-index">01</span>
          <div class="system-layer-kicker">model core</div>
          <div class="llm-core-heading">
            <strong>${esc(llm.title || "LLM")}</strong>
            <span>${esc(llm.subtitle || "predicts the next token from context")}</span>
          </div>
          <div class="llm-foundation-flow">
            <span class="foundation-node"><b>${esc(llm.token || "token")}</b><small>unit</small></span>
            <span class="foundation-arrow" aria-hidden="true">→</span>
            <span class="foundation-node"><b>${esc(llm.embedding || "embedding")}</b><small>representation</small></span>
            <span class="foundation-arrow" aria-hidden="true">→</span>
            <span class="prediction-node">next token <i aria-hidden="true">↻</i></span>
          </div>
        </section>

        <section class="map-agent-shell concept-layer">
          <span class="system-layer-index">02</span>
          <div class="system-layer-heading agent-layer-heading">
            <span class="system-layer-kicker">behavior</span>
            <strong>${esc(agent.title || "agent")}</strong>
            <small>${esc(agent.subtitle || "uses a model with tools in a loop")}</small>
          </div>
          <div class="rao-mini" aria-label="Reason, act, observe loop">
            <span>reason</span><span>act</span><span>observe</span>
            <i class="rao-path rao-path-out" aria-hidden="true"></i>
            <i class="rao-path rao-path-back" aria-hidden="true"></i>
          </div>
          <div class="agent-toolset">
            <b>${esc(agent.toolsLabel || "tools")}</b>
            <div>${pills(agent.tools || [], "tool-pill")}</div>
          </div>
        </section>

        <section class="map-harness-shell concept-layer">
          <span class="system-layer-index">03</span>
          <div class="system-layer-heading harness-layer-heading">
            <span class="system-layer-kicker">runtime</span>
            <strong>${esc(harness.title || "agent harness")}</strong>
            <small>${esc(harness.subtitle || "makes the loop executable and bounded")}</small>
          </div>
          <div class="harness-capabilities">${pills(harness.capabilities || [], "harness-pill")}</div>
        </section>

        <section class="map-coding-shell concept-layer">
          <span class="system-layer-index">04</span>
          <div class="system-layer-heading coding-layer-heading">
            <span class="system-layer-kicker">specialization</span>
            <strong>${esc(coding.title || "coding agent")}</strong>
            <small>${esc(coding.subtitle || "applies the system to software work")}</small>
          </div>
          <div class="coding-capabilities">${pills(coding.capabilities || [], "coding-pill")}</div>
          <div class="system-reading"><span>Read inside → out</span> representation · prediction · action · orchestration · software work</div>
        </section>
      </div>`;
  }

  function workflowRoleClass(kind) {
    return ["codex", "human", "chat"].includes(kind) ? `agent-role-${kind}` : "agent-role-neutral";
  }

  function renderCrossAgentWorkflow(slide) {
    const nodes = slide.nodes || [];
    const parts = [];
    nodes.forEach((node, i) => {
      parts.push(`
        <article class="agent-workflow-node ${workflowRoleClass(node.kind)}">
          <div class="agent-workflow-meta">
            <span class="agent-workflow-symbol">${esc(node.symbol || String(i + 1))}</span>
            <span>${esc(node.role || "Agent")}</span>
          </div>
          <h3>${esc(node.title || "Workflow step")}</h3>
          <ul>${(node.bullets || []).map((item) => `<li>${esc(item)}</li>`).join("")}</ul>
          ${node.output ? `<div class="agent-workflow-output"><span>Output</span>${esc(node.output)}</div>` : ""}
        </article>`);
      if (i < nodes.length - 1) parts.push(`<div class="agent-workflow-arrow" aria-hidden="true">&rarr;</div>`);
    });

    return `${renderHeading(slide)}
      <div class="agent-workflow">
        <div class="agent-workflow-track">${parts.join("")}</div>
        <div class="agent-workflow-feedback">
          <span>${esc(slide.feedbackLabel || "Feedback")}</span>
          <b>${esc(slide.feedback || "Unexpected results and unresolved questions return to the workflow.")}</b>
          <i aria-hidden="true">&larr;</i>
        </div>
      </div>`;
  }

  function renderHandoffBullet(item) {
    const bullet = typeof item === "string" ? { text: item } : item;
    return `<li>${esc(bullet.text || "")}${bullet.code ? ` <code>${esc(bullet.code)}</code>` : ""}</li>`;
  }

  function renderHandoffTerminal(prompt) {
    return `<article class="handoff-terminal ${workflowRoleClass(prompt.kind)}">
      <div class="handoff-terminal-bar">
        <span class="practice-terminal-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>${esc(prompt.route || "Agent handoff")}</span>
      </div>
      <div class="handoff-terminal-body">
        <h3>${esc(prompt.title || "Handoff prompt")}</h3>
        ${prompt.lead ? `<p>${esc(prompt.lead)}</p>` : ""}
        <ul>${(prompt.bullets || []).map(renderHandoffBullet).join("")}</ul>
      </div>
    </article>`;
  }

  function renderCrossAgentPrompts(slide) {
    const practice = slide.practice || {};
    const rawLabel = String(practice.label || "Good practice").trim();
    const labelMatch = rawLabel.match(/^(.*?)(\d+)$/);
    const kicker = labelMatch ? labelMatch[1].trim() : rawLabel;
    const number = labelMatch ? labelMatch[2].padStart(2, "0") : "";
    const prompts = slide.prompts || [];

    return `${renderHeading(slide)}
      <div class="handoff-practice">
        <div class="handoff-practice-heading">
          <div class="practice-marker">
            <span class="practice-kicker">${esc(kicker)}</span>
            ${number ? `<span class="practice-number">${esc(number)}</span>` : ""}
          </div>
          <strong>${esc(practice.title || "Make both handoffs explicit")}</strong>
        </div>
        <div class="handoff-grid">
          ${prompts[0] ? renderHandoffTerminal(prompts[0]) : ""}
          <div class="handoff-review">
            <span>${esc(slide.reviewLabel || "Human review")}</span>
            <b>${esc(slide.reviewText || "Check evidence")}</b>
          </div>
          ${prompts[1] ? renderHandoffTerminal(prompts[1]) : ""}
        </div>
      </div>`;
  }

  function learningLevelClass(accent) {
    return ["cyan", "purple", "green"].includes(accent) ? `learning-level-${accent}` : "learning-level-cyan";
  }

  function renderLearningPath(slide) {
    const levels = slide.levels || [];
    return `${renderHeading(slide)}
      <div class="learning-path">
        <div class="learning-path-track">
          ${levels.map((level, index) => `
            <article class="learning-level learning-level-step-${index + 1} ${learningLevelClass(level.accent)}">
              <div class="learning-level-meta">
                <span>${String(index + 1).padStart(2, "0")}</span>
                <b>${esc(level.label || "Level")}</b>
              </div>
              <h3>${esc(level.question || level.title || "R learning goal")}</h3>
              <ul>${(level.bullets || []).map((item) => `<li>${esc(item)}</li>`).join("")}</ul>
              <div class="learning-level-output">
                <span>${esc(level.outputLabel || "Output")}</span>
                <strong>${esc(level.output || "Reviewable artifact")}</strong>
              </div>
            </article>
            ${index < levels.length - 1 ? `<div class="learning-road-link learning-road-link-${index + 1}" aria-hidden="true"><i></i></div>` : ""}`).join("")}
        </div>
        <div class="learning-path-principle">
          <span>${esc(slide.principleLabel || "As scope grows")}</span>
          <b>${esc(slide.principle || "Make criteria, validation, and human review more explicit.")}</b>
          <i aria-hidden="true">&rarr;</i>
        </div>
      </div>`;
  }

  function renderClosingSummaryCard(card) {
    return `<article class="closing-summary-card ${accentClass(card.accent)}">
      <div class="closing-summary-label">${esc(card.label || "Summary")}</div>
      <h3>${esc(card.title || "Seminar idea")}</h3>
      <p>${esc(card.body || "")}</p>
      ${card.flow ? `<div class="closing-summary-flow">${esc(card.flow)}</div>` : ""}
    </article>`;
  }

  function renderClosingPracticeButton(practice, index) {
    const active = index === 0;
    return `<button class="closing-practice-button${active ? " is-active" : ""}" type="button"
      data-practice-index="${index}" aria-pressed="${active ? "true" : "false"}"
      aria-controls="closing-practice-detail-${index}">
      <span>${esc(practice.number || String(index + 1).padStart(2, "0"))}</span>
      <strong>${esc(practice.title || "Good practice")}</strong>
      <i aria-hidden="true">&rarr;</i>
    </button>`;
  }

  function renderClosingPracticeDetail(practice, index) {
    return `<article class="closing-practice-detail${index === 0 ? " is-active" : ""}"
      id="closing-practice-detail-${index}" data-practice-detail="${index}"${index === 0 ? "" : " hidden"}>
      <div class="closing-practice-detail-meta">
        <span>Good practice</span>
        <b>${esc(practice.number || String(index + 1).padStart(2, "0"))}</b>
      </div>
      <h3>${esc(practice.title || "Good practice")}</h3>
      <p>${esc(practice.body || "")}</p>
      <ul>${(practice.bullets || []).map((item) => `<li>${esc(item)}</li>`).join("")}</ul>
    </article>`;
  }

  function renderInteractiveClosingRecap(slide) {
    const summaryCards = slide.summaryCards || [];
    const practices = slide.practices || [];
    return `${renderHeading(slide)}
      <div class="closing-recap">
        <div class="closing-summary-grid" aria-label="Seminar summary">
          ${summaryCards.map(renderClosingSummaryCard).join("")}
        </div>
        <div class="closing-practice-lab">
          <div class="closing-practice-menu" aria-label="Select a Good Practice">
            <div class="closing-practice-menu-heading">
              <span>Good practices</span>
              <small>Choose one to review</small>
            </div>
            ${practices.map(renderClosingPracticeButton).join("")}
          </div>
          <div class="closing-practice-stage" aria-live="polite">
            ${practices.map(renderClosingPracticeDetail).join("")}
          </div>
        </div>
      </div>`;
  }

  function layoutCustom(slide) {
    if (slide.variant === "llm-concept-map") return renderLlmConceptMap(slide);
    if (slide.variant === "agent-system-map") return renderAgentSystemMap(slide);
    if (slide.variant === "cross-agent-workflow") return renderCrossAgentWorkflow(slide);
    if (slide.variant === "cross-agent-prompts") return renderCrossAgentPrompts(slide);
    if (slide.variant === "r-learning-path") return renderLearningPath(slide);
    if (slide.variant === "interactive-closing-recap") return renderInteractiveClosingRecap(slide);
    return `${renderHeading(slide)}<div class="custom-wrap">${slide.html || ""}</div>`;
  }

  const renderers = {
    title: layoutTitle,
    image: layoutImage,
    cards: layoutCards,
    metrics: layoutMetrics,
    split: layoutSplit,
    process: layoutProcess,
    loop: layoutLoop,
    timeline: layoutTimeline,
    closing: layoutClosing,
    custom: layoutCustom
  };

  function renderDeck() {
    const total = deckData.slides.length;
    deckEl.innerHTML = deckData.slides.map((slide, index) => {
      const layout = renderers[slide.layout] ? slide.layout : "custom";
      const classes = ["slide", `layout-${layout}`];
      if (layout === "title" && !slide.image) classes.push("no-image");
      const slideId = slide.id || `slide-${index + 1}`;
      const sectionKey = String(slide.section || "presentation")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
      return `<section class="${classes.join(" ")}" data-slide-index="${index}" data-slide-id="${esc(slideId)}" data-layout="${layout}" data-section="${esc(sectionKey)}">
        ${renderTopbar(slide, index, total)}
        ${renderers[layout](slide)}
      </section>`;
    }).join("");
    document.title = deckData.meta?.title || "Presentation";
  }

  renderDeck();

  const slides = [...document.querySelectorAll(".slide")];
  const total = slides.length;
  const notesPanel = document.getElementById("speaker-notes");
  const notesContent = document.getElementById("notes-content");
  const notesSlideId = document.getElementById("notes-slide-id");
  let current = 0;
  const revealAllByDefault = new URLSearchParams(location.search).get("reveal") === "all";
  const revealProgress = slides.map(() => 0);
  const fragmentSets = slides.map((slideEl, index) => {
    const reveal = deckData.slides[index]?.reveal;
    if (!reveal?.selector) return [];
    const fragments = [...slideEl.querySelectorAll(reveal.selector)];
    fragments.forEach((fragment, fragmentIndex) => {
      fragment.classList.add("fragment");
      fragment.dataset.fragmentIndex = String(fragmentIndex);
    });
    if (revealAllByDefault) revealProgress[index] = fragments.length;
    return fragments;
  });

  function activateClosingPractice(slideEl, requestedIndex, focus = false) {
    if (!slideEl) return;
    const buttons = [...slideEl.querySelectorAll(".closing-practice-button")];
    const details = [...slideEl.querySelectorAll(".closing-practice-detail")];
    if (!buttons.length || !details.length) return;
    const index = Math.max(0, Math.min(Number(requestedIndex) || 0, buttons.length - 1));
    buttons.forEach((button, buttonIndex) => {
      const active = buttonIndex === index;
      button.classList.toggle("is-active", active);
      button.setAttribute("aria-pressed", active ? "true" : "false");
    });
    details.forEach((detail, detailIndex) => {
      const active = detailIndex === index;
      detail.hidden = !active;
      detail.classList.toggle("is-active", active);
    });
    const stage = slideEl.querySelector(".closing-practice-stage");
    if (stage) stage.dataset.activePractice = String(index + 1);
    if (focus) buttons[index]?.focus({ preventScroll: true });
  }

  slides
    .filter((slideEl) => slideEl.querySelector(".closing-practice-button"))
    .forEach((slideEl) => activateClosingPractice(slideEl, 0));

  deckEl.addEventListener("click", (event) => {
    const button = event.target.closest(".closing-practice-button");
    if (!button) return;
    activateClosingPractice(button.closest(".slide"), button.dataset.practiceIndex);
  });

  deckEl.addEventListener("keydown", (event) => {
    const button = event.target.closest(".closing-practice-button");
    if (!button) return;
    const slideEl = button.closest(".slide");
    const buttons = [...slideEl.querySelectorAll(".closing-practice-button")];
    const currentIndex = buttons.indexOf(button);
    let nextIndex = currentIndex;
    if (event.key === "ArrowDown" || event.key === "ArrowRight") nextIndex = (currentIndex + 1) % buttons.length;
    else if (event.key === "ArrowUp" || event.key === "ArrowLeft") nextIndex = (currentIndex - 1 + buttons.length) % buttons.length;
    else if (event.key === "Home") nextIndex = 0;
    else if (event.key === "End") nextIndex = buttons.length - 1;
    else if (event.key === "Enter" || event.key === " ") nextIndex = currentIndex;
    else return;
    event.preventDefault();
    event.stopPropagation();
    activateClosingPractice(slideEl, nextIndex, true);
  });

  function applyReveal(index = current) {
    const fragments = fragmentSets[index] || [];
    const visible = Math.max(0, Math.min(revealProgress[index] || 0, fragments.length));
    fragments.forEach((fragment, fragmentIndex) => {
      const revealed = fragmentIndex < visible;
      fragment.classList.toggle("is-revealed", revealed);
      fragment.classList.toggle("is-hidden", !revealed);
      fragment.setAttribute("aria-hidden", revealed ? "false" : "true");
    });
    const slide = slides[index];
    if (slide) {
      slide.dataset.revealStep = String(visible);
      slide.dataset.revealTotal = String(fragments.length);
    }
  }

  function revealNext() {
    const fragments = fragmentSets[current] || [];
    if (revealProgress[current] >= fragments.length) return false;
    revealProgress[current] += 1;
    applyReveal(current);
    return true;
  }

  function concealPrevious() {
    if ((revealProgress[current] || 0) <= 0) return false;
    revealProgress[current] -= 1;
    applyReveal(current);
    return true;
  }

  function revealAll(index = current) {
    revealProgress[index] = (fragmentSets[index] || []).length;
    applyReveal(index);
  }

  function revealNone(index = current) {
    revealProgress[index] = 0;
    applyReveal(index);
  }

  function fit() {
    const notesOpen = notesPanel && !document.body.classList.contains("notes-hidden");
    const availableWidth = Math.max(320, window.innerWidth - (notesOpen ? 380 : 0));
    const scale = Math.min(availableWidth / 1280, window.innerHeight / 720);
    deckEl.style.transform = `scale(${scale})`;
  }

  function noteSection(label, value) {
    const items = Array.isArray(value) ? value : (value ? [value] : []);
    if (!items.length) return "";
    return `<section class="note-section"><h3>${esc(label)}</h3>${renderBullets(items)}</section>`;
  }

  function updateSpeakerNotes() {
    if (!notesPanel || !notesContent || !notesSlideId) return;
    const slideId = slides[current]?.dataset.slideId || "";
    const note = speakerNotes[slideId] || {};
    notesSlideId.textContent = slideId;
    const duration = Number(note.durationSeconds);
    notesContent.innerHTML = `
      ${Number.isFinite(duration) && duration > 0 ? `<div class="note-duration">${Math.round(duration)} seconds</div>` : ""}
      ${noteSection("Talk track", note.talkTrack)}
      ${noteSection("Evidence", note.evidence)}
      ${noteSection("Caveats", note.caveats)}
      ${noteSection("Audience interaction", note.audienceInteraction)}
      ${noteSection("Sources", note.sources)}
      ${noteSection("From previous", note.transitionFromPrevious)}
      ${noteSection("To next", note.transitionToNext)}
      ${Object.keys(note).length ? "" : `<p class="notes-empty">No notes recorded for this slide.</p>`}`;
  }

  function toggleNotes(force) {
    if (!notesPanel) return;
    const hidden = typeof force === "boolean"
      ? !force
      : !document.body.classList.contains("notes-hidden");
    document.body.classList.toggle("notes-hidden", hidden);
    fit();
  }

  function updateUrl() {
    const hash = `#${current + 1}`;
    if (location.hash !== hash) history.replaceState(null, "", hash);
  }

  function show(index) {
    current = (index + total) % total;
    slides.forEach((slide, i) => slide.classList.toggle("active", i === current));
    applyReveal(current);
    countEl.textContent = `${current + 1} / ${total}`;
    updateUrl();
    updateSpeakerNotes();
    if (document.body.classList.contains("debug")) checkOverflow();
  }

  function requestedSlide() {
    const params = new URLSearchParams(location.search);
    const query = Number(params.get("slide"));
    if (Number.isFinite(query) && query >= 1 && query <= total) return query - 1;
    const hash = Number(location.hash.replace("#", ""));
    if (Number.isFinite(hash) && hash >= 1 && hash <= total) return hash - 1;
    return 0;
  }

  function checkOverflow() {
    slides.forEach((slide) => {
      slide.classList.remove("overflowing");
      slide.querySelectorAll(".debug-badge").forEach((badge) => badge.remove());
      const overflow = slide.scrollHeight > slide.clientHeight + 1 || slide.scrollWidth > slide.clientWidth + 1;
      if (overflow) {
        slide.classList.add("overflowing");
        const badge = document.createElement("div");
        badge.className = "debug-badge";
        badge.textContent = "OVERFLOW";
        slide.appendChild(badge);
        console.warn(`Slide ${Number(slide.dataset.slideIndex) + 1} overflows its 1280x720 canvas.`);
      }
    });
  }

  function toggleDebug(force) {
    const enabled = typeof force === "boolean" ? force : !document.body.classList.contains("debug");
    document.body.classList.toggle("debug", enabled);
    if (enabled) checkOverflow();
    else slides.forEach((slide) => slide.classList.remove("overflowing"));
  }

  window.addEventListener("resize", fit);
  window.addEventListener("hashchange", () => show(requestedSlide()));
  document.getElementById("prev").addEventListener("click", () => {
    if (!concealPrevious()) show(current - 1);
  });
  document.getElementById("next").addEventListener("click", () => {
    if (!revealNext()) show(current + 1);
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "ArrowRight" || event.key === " " || event.key === "PageDown") {
      event.preventDefault();
      if (!revealNext()) show(current + 1);
    }
    if (event.key === "ArrowLeft" || event.key === "PageUp") {
      event.preventDefault();
      if (!concealPrevious()) show(current - 1);
    }
    if (event.key.toLowerCase() === "f") {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }
    if (event.key.toLowerCase() === "d") toggleDebug();
    if (event.key.toLowerCase() === "p") window.print();
    if (event.key.toLowerCase() === "n") toggleNotes();
  });

  document.fonts?.ready.then(() => {
    if (new URLSearchParams(location.search).get("notes") === "0") toggleNotes(false);
    fit();
    if (new URLSearchParams(location.search).get("debug") === "1") toggleDebug(true);
  });

  window.addEventListener("beforeprint", () => slides.forEach((_, index) => revealAll(index)));

  window.DECK_API = {
    show,
    fit,
    checkOverflow,
    toggleDebug,
    toggleNotes,
    revealNext,
    revealAll,
    revealNone,
    total
  };
  fit();
  show(requestedSlide());
})();

</script>
</body>
</html>
